    list.forEach(function(x){var n=x.proj||'';if(!(n in gm)){gm[n]=[];go.push(n);}gm[n].push(x);});
    go=go.filter(function(n){return n!==''&&gm[n].length;}).concat(gm['']&&gm[''].length?['']:[]);
    go.forEach(function(n){var c=!!col[n||'__none'];h+='<button class="gh" data-act="gt" data-id="'+esc(n||'__none')+'" aria-expanded="'+(c?'false':'true')+'"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate('+(c?-90:0)+'deg);transition:transform .15s"><path d="M6 9l6 6 6-6"/></svg>'+esc(n||'미분류')+'<b>'+gm[n].length+'</b></button>'+(c?'':gm[n].map(listItem).join(''));});
  }else h+=list.map(listItem).join('');
  h+='</div>'+detail(cur)+'</div></div>';
  app.innerHTML=h+formHtml(); if(!formOpen)mi=null;
  if(cur&&(cur.src==='mail'||cur.file))ensureTr(cur);
  wireForm();
}
function wireForm(){
  var f=document.getElementById('f');
  if(f){f.addEventListener('submit',function(e){
    e.preventDefault();
    var title=document.getElementById('f-title').value.trim(); if(!title)return;
    var id='x:'+Date.now();
    manual.push({id:id,type:document.getElementById('f-type').value,title:title,project:document.getElementById('f-proj').value.trim(),base:document.getElementById('f-date').value||today(),due:document.getElementById('f-due').value||'',note:document.getElementById('f-note').value.trim(),done:false});
    if(mi){var lm=manual[manual.length-1];lm.file=true;lm.from=mi.from;lm.summary=mi.summary;lm.preview=mi.preview;mi=null;}
    var pv=document.getElementById('f-prio').value; if(pv!=='n'){prio[id]=pv;save('mt_prio',prio);}
    save('mt_manual',manual); formOpen=false; if(view!=='all'&&view!=='home')view=manual[manual.length-1].type==='wait'?'wait':'todo'; save('mt_view2',view); sel=id; render();
  });
  var dz=document.getElementById('dz'),mf=document.getElementById('mf'),st=document.getElementById('dzs');
  function say(s){st.textContent=s;}
  function handle(files){
    files=[].slice.call(files||[]).filter(function(x){return /\.(msg|eml)$/i.test(x.name);});
    if(!files.length){say('.msg 또는 .eml 파일만 인식합니다.');return;}
    say('읽는 중...');
    Promise.all(files.map(function(x){return readMail(x).catch(function(){return null;});})).then(function(rs){
      var ok=rs.filter(Boolean),bad=rs.length-ok.length;
      if(!ok.length){say('메일을 읽지 못했습니다. 파일이 손상됐거나 지원하지 않는 형식입니다.');return;}
      if(ok.length===1){var r=ok[0];mi=r;
        document.getElementById('f-title').value=r.title;document.getElementById('f-proj').value=r.project;document.getElementById('f-date').value=r.base;document.getElementById('f-type').value='todo';
        say('읽었습니다: '+(r.from?r.from+' · ':'')+r.base+(r.noDate?' (날짜를 못 읽어 오늘로 표시)':'')+(r.project?' · 프로젝트 '+r.project:' · 프로젝트 미분류')+'. 내용을 확인하고 추가를 누르세요.');return;}
      var tp=document.getElementById('f-type').value,pv=document.getElementById('f-prio').value,last;
      ok.forEach(function(r,i){var id='x:'+Date.now()+'_'+i;manual.push({id:id,type:tp,title:r.title,project:r.project,base:r.base,done:false,file:true,from:r.from,summary:r.summary,preview:r.preview});if(pv!=='n')prio[id]=pv;last=id;});
      save('mt_prio',prio);save('mt_manual',manual);formOpen=false;if(view!=='all'&&view!=='home')view=tp==='wait'?'wait':'todo';save('mt_view2',view);sel=last;render();
    });
  }
  dz.addEventListener('click',function(){mf.click();});
  dz.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();mf.click();}});
  mf.addEventListener('change',function(){handle(mf.files);});
  ['dragenter','dragover'].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.add('on');});});
  dz.addEventListener('dragleave',function(){dz.classList.remove('on');});
  dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('on');handle(e.dataTransfer&&e.dataTransfer.files);});
  }
}
function setFlag(id,key,val){
  if(id.indexOf('m:')===0||id.indexOf('r:')===0){
    if(key==='done'){done[id]=val;save('mt_done',done);}else{hidden[id]=val;save('mt_hidden',hidden);}
  }else{
    manual.forEach(function(x){if(x.id===id){if(key==='done')x.done=val;else x.deleted=val;}});save('mt_manual',manual);
  }
}
function cur(id){return items().filter(function(x){return x.id===id;})[0];}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b)return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  if(act==='open'){formOpen=true;render();setTimeout(function(){var x=document.getElementById('f-title');if(x)x.focus();},30);}
  else if(act==='go'){var gx=cur(id);if(gx){view=gx.kind;save('mt_view2',view);sel=id;pfilter='';render();}}
  else if(act==='cancel'){formOpen=false;render();}
  else if(act==='mdx'){if(e.target.id==='mdl'){formOpen=false;render();}}
  else if(act==='view'){view=id;save('mt_view2',view);sel=null;render();}
  else if(act==='sel'){sel=id;render();}
  else if(act==='gt'){if(col[id])delete col[id];else col[id]=1;save('mt_col',col);render();}
  else if(act==='cp'){var cx=cur(id);if(cx){var ta=document.createElement('textarea');ta.value=cx.title.replace(/^\s*((re|fw|fwd)\s*:\s*)+/i,'');document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='복사됨';}catch(e){b.textContent='복사 실패';}document.body.removeChild(ta);}}
  else if(act==='tr'){doTr(id,b.getAttribute('data-f'));}
  else if(act==='toggle'){var x=cur(id);if(x)setFlag(id,'done',!x.done);render();}
  else if(act==='del'){setFlag(id,'del',true);render();}
  else if(act==='restore'){setFlag(id,'del',false);render();}
  else if(act==='prio'){var v=b.getAttribute('data-v');if(v==='n')delete prio[id];else prio[id]=v;save('mt_prio',prio);render();}
});
app.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='pf'){pfilter=el.value;save('mt_pf',pfilter);sel=null;render();}
  else if(el.id==='tt'||el.id==='dd'||el.id==='nt'){var mid=el.getAttribute('data-id');manual.forEach(function(m){if(m.id===mid){if(el.id==='tt'){var v0=el.value.trim();if(v0)m.title=v0;}else if(el.id==='dd')m.due=el.value||'';else m.note=el.value.trim();}});save('mt_manual',manual);render();}
  else if(el.id==='pj'){var id=el.getAttribute('data-id'),v=el.value.trim();if(v)projOv[id]=v;else delete projOv[id];save('mt_proj',projOv);render();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&formOpen){formOpen=false;render();}});
render();
app.addEventListener('submit',function(e){
  if(e.target.id!=='qa')return;e.preventDefault();
  var ti=document.getElementById('qa-t'),v=ti.value.trim();if(!v)return;
  var id='x:'+Date.now(),pj=(pfilter&&pfilter!=='__none')?pfilter:'';
  manual.push({id:id,type:'todo',title:v,project:pj,base:today(),due:document.getElementById('qa-d').value||'',note:'',done:false});
  save('mt_manual',manual);render();var n=document.getElementById('qa-t');if(n)n.focus();
});
setInterval(function(){var a=document.activeElement;if(!formOpen&&!(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.value))))(window.top||window).location.reload();},300000);
</script>
