  if(!x.trash)h+='<div class="pr"><label class="l" for="pj">프로젝트</label><input id="pj" list="pjl" data-id="'+id+'" value="'+esc(x.proj)+'" placeholder="비워 두면 자동 분류" maxlength="40"><datalist id="pjl">'+projList.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></div>';
  if(!x.trash)h+='<div class="pr"><span class="l">중요도</span><div class="seg" role="group" aria-label="중요도">'+[['h','높음'],['n','보통'],['l','낮음']].map(function(o){return '<button data-act="prio" data-id="'+id+'" data-v="'+o[0]+'" aria-pressed="'+(x.prio===o[0]?'true':'false')+'">'+o[1]+'</button>';}).join('')+'</div></div>';

  else{
    if(x.entry||(x.src==='manual'&&x.file))h+='<a class="b2 lk" href="mailtodo:open?id='+encodeURIComponent(x.entry||'')+'&amp;s='+encodeURIComponent(x.title)+'" title="Outlook에서 메일을 엽니다">Outlook에서 메일 열기</a><button class="b2" data-act="cp" data-id="'+id+'" title="Outlook 검색창에 붙여넣기용">제목 복사</button>';
    if(x.src==='mail'&&!x.done)h+='<button class="b2" data-act="mk" data-id="'+id+'" title="이 메일에 대한 내 할 일을 만듭니다">할 일로 추가</button>';

  }
  return h+'</div></div></div>';
}

var MAN="<h3>1. 처음 시작<\/h3>\n<ol><li>설치 파일(TODOLIST-Setup.exe)을 실행하면 자동으로 설치되고 프로그램이 열립니다.<\/li>\n<li>첫 실행 때 \"메일 연동 설정 중\" 화면이 1~2분 나옵니다. Outlook 보안 창이 뜨면 <b>허용<\/b>을 눌러 주세요.<\/li>\n<li>설정이 끝나면 대시보드가 열립니다. 이후에는 Windows를 켜면 프로그램이 자동으로 시작됩니다.<\/li><\/ol>\n<p class=\"n\">Outlook 클래식(데스크톱 버전)이 설치되어 있고 로그인되어 있어야 메일 연동이 됩니다.<\/p>\n\n<h3>2. 화면 구성<\/h3>\n<table><tr><th>메뉴<\/th><th>보이는 것<\/th><\/tr>\n<tr><td>대시보드<\/td><td>오늘 처리할 일, 내 할 일(기한 순), 메일 현황, 프로젝트별 진행률을 한 화면에서 봅니다.<\/td><\/tr>\n<tr><td>전체<\/td><td>내 할 일, 회신할 메일, 회신 대기를 색으로 구분해 모두 보여줍니다.<\/td><\/tr>\n<tr><td>할 일<\/td><td>직접 추가한 일만 보여줍니다.<\/td><\/tr>\n<tr><td>회신할 메일<\/td><td>내가 수신자(받는 사람)인데 아직 회신하지 않은 메일입니다.<\/td><\/tr>\n<tr><td>회신 대기<\/td><td>내가 보냈는데 아직 회신이 없는 메일입니다.<\/td><\/tr>\n<tr><td>완료 / 삭제함<\/td><td>완료하거나 지운 항목입니다. 언제든 되돌릴 수 있습니다.<\/td><\/tr><\/table>\n<p class=\"n\">메뉴 옆 빨간 숫자는 처리할 건수입니다. 0건이면 표시하지 않습니다.<\/p>\n\n<h3>3. 할 일 추가하기<\/h3>\n<ol><li>왼쪽 아래 <b>+ 직접 추가<\/b>를 누릅니다.<\/li>\n<li>내용을 적고, 필요하면 프로젝트·기한·메모·중요도를 고른 뒤 <b>추가<\/b>를 누릅니다.<\/li>\n<li>항목 왼쪽 동그라미를 누르면 완료로 넘어갑니다. 실수로 눌렀으면 \"완료\" 메뉴에서 되돌리세요.<\/li>\n<li>항목을 누르면 오른쪽에서 제목·기한·메모·프로젝트·중요도를 바로 고칠 수 있습니다. 입력창 밖을 누르면 저장됩니다.<\/li><\/ol>\n<p class=\"n\">추가 창에 Outlook 메일 파일(.msg, .eml)을 끌어다 놓으면 제목·날짜·프로젝트가 자동으로 채워집니다.<\/p>\n\n<h3>4. 메일 목록 (자동)<\/h3>\n<ul><li><b>회신할 메일<\/b>: 프로그램을 처음 켠 시점부터 받은 메일 중, 내가 받는 사람(TO)이고 아직 회신하지 않은 메일입니다. 참조(CC)와 자동 발송 메일은 제외합니다.<\/li>\n<li><b>회신 대기<\/b>: 보낸 편지함의 메일 중 같은 제목의 회신이 아직 없는 메일입니다.<\/li>\n<li>Outlook에서 회신하면 다음 갱신 때 목록에서 자동으로 사라집니다. 직접 정리하려면 <b>회신 완료<\/b>(또는 <b>회신 받음<\/b>) 버튼을 누르세요.<\/li>\n<li>항목 상세의 <b>Outlook에서 메일 열기<\/b>로 원본 메일을 바로 열 수 있습니다.<\/li><\/ul>\n\n<h3>5. 중요 표시<\/h3>\n<p>항목을 누르고 <b>중요도<\/b>를 \"높음\"으로 바꾸면 주황색 배경과 테두리로 눈에 띄게 표시되고, 대시보드 상단 \"중요\" 숫자에도 잡힙니다.<\/p>\n\n<h3>6. 프로젝트 관리<\/h3>\n<ul><li>왼쪽 아래 <b>＋ 프로젝트 추가<\/b>를 누르면 프로젝트를 추가·삭제할 수 있습니다. 할 일 목록 위의 <b>＋ 추가<\/b> 버튼으로도 열 수 있습니다.<\/li>\n<li>할 일을 추가할 때 새 이름을 입력해도 자동으로 등록됩니다.<\/li>\n<li>삭제해도 이미 그 프로젝트로 분류된 항목은 그대로 남습니다.<\/li>\n<li>메일을 프로젝트별로 자동 분류하려면 <code>C:\\MailTodo\\projects.csv<\/code>에 프로젝트 이름과 키워드(제목에 들어가는 단어, <code>|<\/code>로 구분)를 적습니다.<\/li><\/ul>\n\n<h3>7. 알림과 자동 갱신<\/h3>\n<ul><li>아침 8시 이후 처음 한 번, 오늘 마감·지연·중요 임박 건수와 메일 건수를 알려줍니다. 오후 3시 이후에는 마감·지연이 남아 있을 때만 한 번 더 알려줍니다. 알림을 누르면 창이 열립니다.<\/li>\n<li>메일은 매일 09:00 / 13:00 / 17:00과 Windows 로그인 때 자동으로 갱신됩니다.<\/li>\n<li>창을 닫아도 프로그램은 시계 옆 트레이에서 계속 실행됩니다. 완전히 끄려면 트레이 아이콘을 우클릭해서 <b>종료<\/b>를 누르세요.<\/li>\n<li>왼쪽 아래 <b>↻ 새로고침<\/b>이나 트레이 메뉴의 <b>지금 새로고침<\/b>으로 화면을 바로 새로 읽을 수 있습니다. (메일 자체는 위 시각에 Outlook에서 새로 읽어 옵니다.)<\/li><\/ul>\n\n<h3>8. 백업과 복원<\/h3>\n<p>직접 추가한 할 일은 이 PC의 프로그램 안에 저장됩니다. PC를 바꾸거나 프로그램을 다시 설치할 때는 왼쪽 아래의 <b>백업 저장<\/b>으로 파일을 받아 두었다가, 새로 설치한 뒤 <b>백업 복원<\/b>으로 되돌리세요.<\/p>\n\n<h3>9. 문제가 생겼을 때<\/h3>\n<table><tr><th>증상<\/th><th>확인할 것<\/th><\/tr>\n<tr><td>메일이 하나도 안 보임<\/td><td>Outlook이 켜져 있고 로그인되어 있는지 확인하세요. 상세 내용은 <code>C:\\MailTodo\\mailtodo.log<\/code>에 있습니다.<\/td><\/tr>\n<tr><td>회신할 메일이 0건<\/td><td>프로그램을 처음 켠 시점 이후에 받은 메일만 모읍니다. 제외 대상(참조, 자동 발송)도 확인하세요.<\/td><\/tr>\n<tr><td>알림이 안 뜸<\/td><td>Windows의 \"집중 지원(방해 금지)\"이 켜져 있는지, 알림 설정에서 이 프로그램이 허용되어 있는지 확인하세요.<\/td><\/tr>\n<tr><td>화면이 예전 모양<\/td><td>인터넷 연결을 확인하고 트레이의 \"지금 새로고침\"을 두 번 눌러 보세요.<\/td><\/tr>\n<tr><td>Outlook 보안 창이 계속 뜸<\/td><td>안티바이러스 설정 때문일 수 있습니다. 허용을 누르고 IT 담당자에게 문의하세요.<\/td><\/tr><\/table>\n\n<h3>10. 편의 기능<\/h3>\n<ul><li><b>검색<\/b>: 왼쪽 위 검색창(또는 / 키, Ctrl+F)에 단어를 입력하면 제목·프로젝트·메모·메일 요지에서 찾습니다. Esc로 지웁니다.<\/li>\n<li><b>빠른 추가<\/b>: N 키 또는 Ctrl+N으로 \"직접 추가\" 창을 엽니다. 프로그램이 켜져 있으면 어디서든 Ctrl+Alt+N으로 열 수 있습니다.<\/li>\n<li><b>할 일로 추가<\/b>: 회신할 메일·회신 대기 항목의 상세 화면에서 이 버튼을 누르면 그 메일에 대한 내 할 일이 만들어지고 Outlook 메일 열기 링크도 이어집니다.<\/li>\n<li><b>반복<\/b>: 기한이 있는 할 일에 매 평일·매주·매월을 지정하면 완료할 때 다음 할 일이 자동으로 만들어집니다.<\/li>\n<li><b>체크리스트<\/b>: 할 일 안에 단계를 적고 하나씩 체크합니다. 목록에 진행 상황(예: 1\/3)이 표시됩니다.<\/li>\n<li><b>어두운 화면·글자 크기<\/b>: 왼쪽 아래 버튼으로 바꿉니다. 설정은 기억됩니다.<\/li><\/ul>\n\n<h3>11. 삭제<\/h3>\n<p>Windows 설정 → 앱 → \"TO DO LIST\" → 제거. 자동 갱신 등록도 함께 지워집니다. 메일 정리 파일이 들어 있는 <code>C:\\MailTodo<\/code> 폴더는 필요 없으면 직접 삭제하세요.<\/p>\n";

function visibleList(all){

function chipOk(x,c){
  if(!c)return true;
  if(c==='hot')return x.prio==='h';
  if(x.kind!=='todo'||!x.due)return false;
  return c==='late'?x.dd<0:c==='today'?x.dd===0:(x.dd>0&&x.dd<=6);
}
